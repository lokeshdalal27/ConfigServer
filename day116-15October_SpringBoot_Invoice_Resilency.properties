spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# (Optional but recommended)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Auto-commit OFF
spring.datasource.hikari.auto-commit=false

# Redis - Upstash
spring.data.redis.host=good-stingray-208831.upstash.io
spring.data.redis.port=6379
spring.data.redis.password=gQAAAAAAAy-_AAIgcDE0ZGM4ZTZlZDNlZjM0MDRmOWYwYmIzOWNhZTBhZjRhNw
spring.data.redis.ssl.enabled=true

# Enable Redis Cache
spring.cache.type=redis

# Expose actuator endpoints
management.endpoints.web.exposure.include=health,info,metrics,beans,mappings,env,loggers

# Show detailed health information
management.endpoint.health.show-details=always

# Actuator base path
management.endpoints.web.base-path=/actuator

# Eureka Client Configuration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

management.tracing.enabled=true
management.tracing.sampling.probability=1.0

management.tracing.export.zipkin.endpoint=http://localhost:9411/api/v2/spans

spring.cloud.openfeign.micrometer.enabled=true

logging.pattern.level=%5p [${spring.application.name:},traceId=%X{traceId:-},spanId=%X{spanId:-}]

spring.cloud.openfeign.circuitbreaker.enabled=true
spring.cloud.openfeign.circuitbreaker.alphanumeric-ids.enabled=true

resilience4j.circuitbreaker.instances.categoryService.slidingWindowSize=5
resilience4j.circuitbreaker.instances.categoryService.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.categoryService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.categoryService.waitDurationInOpenState=30s
resilience4j.circuitbreaker.instances.categoryService.permittedNumberOfCallsInHalfOpenState=2
