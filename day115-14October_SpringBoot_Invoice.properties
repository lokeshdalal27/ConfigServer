spring.application.name=day115-14October_SpringBoot_Invoice

# Database configuration
spring.datasource.url=jdbc:mysql://localhost:3306/9th_march_2026
spring.datasource.username=root
spring.datasource.password=Dalal@123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# MySQL dialect auto-detect ho sakta hai; explicit property zaroori nahi
# spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# HikariCP
spring.datasource.hikari.auto-commit=false

# Redis - Upstash
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.ssl.enabled=true
spring.cache.type=redis

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,beans,mappings,env,loggers
management.endpoint.health.show-details=always
management.endpoints.web.base-path=/actuator

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Distributed tracing
management.tracing.sampling.probability=1.0
management.tracing.export.zipkin.endpoint=http://localhost:9411/api/v2/spans
spring.cloud.openfeign.micrometer.enabled=true

# Console logs: application name, trace ID, span ID
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %5level [${spring.application.name:},traceId=%X{traceId:-},spanId=%X{spanId:-}] %logger{36} - %msg%n
